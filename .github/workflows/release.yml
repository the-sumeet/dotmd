name: Release

# Push a tag like v0.2.0 to build every platform and publish a GitHub release.
# Run manually from the Actions tab to build without releasing (artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-beta.19
  NODE_VERSION: "24"

jobs:
  macos:
    # macOS 26 ships Xcode 26, which is needed to compile build/appicon.icon into Assets.car.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build universal app and DMG
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          mkdir -p dist
          mv bin/dotmd.dmg "dist/dotmd-${APP_VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    # Windows builds without CGO, so the app itself cross-compiles from Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The target is Windows, but the wails3 CLI and its binding generator still
      # compile the Linux GTK code on this host, so they need the GTK headers.
      - name: Install NSIS and GTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: ./.github/actions/setup
      - name: Build installers
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            wails3 task windows:package ARCH=$arch
            mv "bin/dotmd-${arch}-installer.exe" "dist/dotmd-${APP_VERSION}-windows-${arch}-installer.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # nfpm fills the package architecture and maintainer fields from these.
      GOARCH: ${{ matrix.arch }}
      GIT_COMMITTER_NAME: Sumeet Mathpati
      GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: ./.github/actions/setup
      - name: Build packages
        run: |
          # create:appimage builds the binary and .desktop file that deb/rpm reuse.
          wails3 task linux:create:appimage
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          mkdir -p dist
          mv bin/dotmd.deb "dist/dotmd-${APP_VERSION}-linux-${GOARCH}.deb"
          mv bin/dotmd.rpm "dist/dotmd-${APP_VERSION}-linux-$(uname -m).rpm"
          mv bin/dotmd-*.AppImage "dist/dotmd-${APP_VERSION}-linux-$(uname -m).AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Installing

          These builds aren't signed by Apple or Microsoft yet, so the first launch shows a warning.

          - **macOS:** open the `.dmg` and drag dotmd to Applications. On first launch macOS blocks it; go to **System Settings → Privacy & Security** and click **Open Anyway**.
          - **Windows:** run the installer for your CPU (`amd64` for most PCs). If SmartScreen appears, click **More info → Run anyway**.
          - **Linux:** install the `.deb` or `.rpm` with your package manager, or `chmod +x` the `.AppImage` and run it. Requires GTK 4 and WebKitGTK 6.0 (Ubuntu 24.04+, Debian 13+, Fedora 40+).

          Verify downloads against `SHA256SUMS.txt`.
          EOF
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dotmd ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"
